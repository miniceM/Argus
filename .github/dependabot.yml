version: 2

updates:
  # Actions 已按 commit SHA 固定，版本升级只能由 Dependabot 完成（人工改 tag 会破坏固定策略）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/services/console"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "console"

  - package-ecosystem: "docker"
    directory: "/services/eval-runner"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/services/console"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/services/real-llm-agent"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/services/demo-agent"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/deploy/langfuse"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"

  # 根 requirements-dev.txt 通过 -r 纳入两个服务，避免重复扫描同一 manifest。
  # 新 Python 项目需核对引用覆盖，根目录不代表扫描所有子项目。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1 */2 *"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
