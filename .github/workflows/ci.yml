name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/eval-runner/requirements.txt
            services/demo-agent/requirements.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Ruff
        run: python -m ruff check services tests --output-format=github

      - name: Compile Python sources
        run: python -m compileall -q services tests

      - name: Validate YAML / JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          yaml.safe_load(Path("docker-compose.yml").read_text())
          yaml.safe_load(Path("docker-compose.cloud.yml").read_text())
          yaml.safe_load(Path("config/agents.yaml").read_text())
          seed = json.loads(Path("data/dataset.json").read_text())
          assert len(seed["items"]) == 6
          assert len({item["id"] for item in seed["items"]}) == 6
          print("configuration validation: OK")
          PY

      - name: Verify architecture invariants
        run: |
          if grep -RinE '^[[:space:]]*(from|import)[[:space:]]+langfuse|Evaluation\(|run_experiment' services/demo-agent --include='*.py'; then
            echo "Demo Agent must not contain evaluation-platform dependencies" >&2
            exit 1
          fi
          if grep -in 'langfuse' services/demo-agent/requirements.txt; then
            echo "Demo Agent requirements must not contain Langfuse" >&2
            exit 1
          fi
          grep -q 'inject(headers)' services/eval-runner/app/main.py

  unit-tests:
    name: Full Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/eval-runner/requirements.txt
            services/demo-agent/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run all tests with coverage
        run: |
          python -m pytest tests -q             --junitxml=artifacts/junit.xml             --cov=services/demo-agent             --cov=services/eval-runner/app             --cov-branch             --cov-report=term-missing             --cov-report=xml:artifacts/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Docker / Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate self-hosted Compose
        run: docker compose --env-file .env.poc -f docker-compose.yml config -q

      - name: Validate cloud Compose
        run: |
          cp .env.cloud.example .env.cloud
          docker compose --env-file .env.cloud -f docker-compose.cloud.yml config -q

      - name: Build application images
        run: |
          docker build -t argus-demo-agent:ci services/demo-agent
          docker build -t argus-eval-runner:ci services/eval-runner

  cloud-e2e:
    name: Langfuse Cloud E2E
    needs: [quality, unit-tests, docker-build]
    if: >
      vars.LANGFUSE_E2E_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: langfuse-e2e
    concurrency:
      group: argus-langfuse-cloud-e2e
      cancel-in-progress: false
    env:
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Langfuse Cloud secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LANGFUSE_BASE_URL" || { echo "Missing LANGFUSE_BASE_URL in environment langfuse-e2e"; exit 1; }
          test -n "$LANGFUSE_PUBLIC_KEY" || { echo "Missing LANGFUSE_PUBLIC_KEY in environment langfuse-e2e"; exit 1; }
          test -n "$LANGFUSE_SECRET_KEY" || { echo "Missing LANGFUSE_SECRET_KEY in environment langfuse-e2e"; exit 1; }

      - name: Create CI cloud env file
        shell: bash
        run: |
          umask 077
          {
            printf 'LANGFUSE_BASE_URL=%s\n' "$LANGFUSE_BASE_URL"
            printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$LANGFUSE_PUBLIC_KEY"
            printf 'LANGFUSE_SECRET_KEY=%s\n' "$LANGFUSE_SECRET_KEY"
          } > .env.cloud

      - name: Run cloud end-to-end tests
        env:
          E2E_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: bash scripts/ci-e2e-cloud.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langfuse-cloud-e2e-${{ github.run_id }}
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 14
