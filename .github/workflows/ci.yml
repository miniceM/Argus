name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/eval-runner/requirements.txt
            services/demo-agent/requirements.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps services/argus-cli
          python -m pip check

      - name: Verify installed release CLI
        run: |
          argus --help
          argus eval run --help

      - name: Ruff
        run: python -m ruff check services tests scripts/ci --output-format=github

      - name: Compile Python sources
        run: python -m compileall -q services tests scripts/ci

      - name: Validate YAML / JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          yaml.safe_load(Path("docker-compose.yml").read_text())
          yaml.safe_load(Path("docker-compose.cloud.yml").read_text())
          yaml.safe_load(Path("config/agents.yaml").read_text())
          seed = json.loads(Path("data/dataset.json").read_text())
          assert len(seed["items"]) == 6
          assert len({item["id"] for item in seed["items"]}) == 6
          print("configuration validation: OK")
          PY

      - name: Verify architecture invariants
        run: |
          if grep -RinE '^[[:space:]]*(from|import)[[:space:]]+langfuse|Evaluation\(|run_experiment' services/demo-agent --include='*.py'; then
            echo "Demo Agent must not contain evaluation-platform dependencies" >&2
            exit 1
          fi
          if grep -in 'langfuse' services/demo-agent/requirements.txt; then
            echo "Demo Agent requirements must not contain Langfuse" >&2
            exit 1
          fi
          grep -q 'inject(headers)' services/eval-runner/app/main.py

      - name: Verify OpenAPI specification is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json || (echo "docs/openapi.json is out of date; run 'python scripts/export_openapi.py' and commit changes" >&2 && exit 1)

  unit-tests:
    name: Full Python Tests
    runs-on: ubuntu-latest
    # 上次含 PostgreSQL 的 coverage 门禁在 66% 处耗尽 10 分钟，保留有限扩展预算。
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus_password
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/eval-runner/requirements.txt
            services/demo-agent/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run all tests with coverage
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://argus:argus_password@localhost:5432/argus_test
        run: |
          python -m pytest tests -q --maxfail=1 --tb=short --durations=20 -m "not trajectory_local" \
            --junitxml=artifacts/junit.xml \
            --cov=services/demo-agent \
            --cov=services/eval-runner/app \
            --cov=services/argus-cli/src/argus_cli \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  trajectory-local:
    name: S4 Local Langfuse Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/fixtures/trajectory_agents/requirements.txt
      - name: Install Runner test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare hash-locked Agents and digest-pinned local services
        run: make trajectory-prepare
      - name: Verify real local ingestion and production invocation
        run: |
          mkdir -p artifacts
          python -u -m pytest -vv -x tests/test_trajectory_backend_integration.py tests/test_trajectory_observation_integration.py tests/test_trajectory_rule_integration.py -m trajectory_local \
            --basetemp=artifacts/s4-local --junitxml=artifacts/s4-junit.xml --tb=short --durations=10
      - name: Upload field and lineage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s4-local-observation-evidence
          path: |
            artifacts/s4-junit.xml
            artifacts/s4-local/**/field-matrix.json
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Docker / Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate self-hosted Compose
        run: docker compose --env-file .env.poc -f docker-compose.yml config -q

      - name: Validate cloud Compose
        run: |
          cp .env.cloud.example .env.cloud
          docker compose --env-file .env.cloud -f docker-compose.cloud.yml config -q

      - name: Build application images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/demo-agent
          load: true
          push: false
          tags: argus-demo-agent:ci
          cache-from: type=gha,scope=demo-agent
          cache-to: type=gha,mode=max,scope=demo-agent

      - name: Build eval-runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/eval-runner
          load: true
          push: false
          tags: argus-eval-runner:ci
          build-args: |
            ARGUS_BUILD_ID=${{ github.sha }}
            RUNNER_VERSION=0.1.0
          cache-from: type=gha,scope=eval-runner
          cache-to: type=gha,mode=max,scope=eval-runner

      - name: Build console image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/console
          load: true
          push: false
          tags: argus-console:ci
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  console:
    name: Console Quality & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.5.2
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/console/pnpm-lock.yaml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/eval-runner/requirements.txt
            services/demo-agent/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Install frontend dependencies
        run: pnpm --dir services/console install --frozen-lockfile

      - name: Verify OpenAPI TypeScript contract sync
        run: |
          pnpm --dir services/console api:generate
          git diff --exit-code services/console/src/api/schema.d.ts || (echo "Console OpenAPI TypeScript contract out of sync" >&2 && exit 1)

      - name: Console Design Token Lint
        run: pnpm --dir services/console lint:tokens

      - name: Console Typecheck
        run: pnpm --dir services/console typecheck

      - name: Console Unit Tests
        run: pnpm --dir services/console test

      - name: Console Build
        run: pnpm --dir services/console build

      - name: Install Playwright Browsers
        run: pnpm --dir services/console exec playwright install --with-deps chromium

      - name: Console Playwright E2E Tests (Mock & Real API)
        run: pnpm --dir services/console test:e2e

  cloud-e2e-policy:
    name: Langfuse Cloud E2E
    needs: [quality, unit-tests, docker-build, console, trajectory-local]
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Summarize no-secret Cloud coverage
        env:
          CI_CHECKS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TESTED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["CI_CHECKS_JSON"])
          checks = {
              "Code Quality": needs.get("quality", {}).get("result", "not run"),
              "Full Python Tests": needs.get("unit-tests", {}).get("result", "not run"),
              "Docker / Compose Validation": needs.get("docker-build", {}).get("result", "not run"),
              "Console Quality & E2E": needs.get("console", {}).get("result", "not run"),
              "S4 Local Langfuse Integration": needs.get("trajectory-local", {}).get("result", "not run"),
          }
          lines = [
              "## Langfuse Cloud E2E coverage",
              "",
              "- Cloud state: `skipped_by_policy`",
              "- Policy state: `awaiting trusted policy evaluation`",
              "- Reason: Pull requests and non-main dispatches never receive Langfuse secrets.",
              f"- Event/ref: `{os.environ['EVENT_NAME']}` / `{os.environ['REF_NAME']}`",
              f"- PR: `{os.environ['PR_NUMBER'] or 'not applicable'}`",
              f"- Head/base/tested SHA: `{os.environ['HEAD_SHA']}` / `{os.environ['BASE_SHA'] or 'not applicable'}` / `{os.environ['TESTED_SHA']}`",
              "- Risk: `unclassified by trusted policy publisher`",
              "- Regular CI:",
              *[f"  - {name}: `{result}`" for name, result in checks.items()],
              f"- Evidence: {os.environ['RUN_URL']}",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Cloud state: skipped_by_policy; no Langfuse secrets were accessed")
          PY

  cloud-e2e-main:
    name: Main Langfuse Cloud E2E
    needs: [quality, unit-tests, docker-build, console, trajectory-local]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: langfuse-e2e
    permissions:
      contents: read
    concurrency:
      group: argus-langfuse-cloud-e2e
      cancel-in-progress: false
    steps:
      - name: Validate main Cloud prerequisites
        id: gate
        if: always()
        env:
          LANGFUSE_E2E_ENABLED: ${{ vars.LANGFUSE_E2E_ENABLED }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTHON_RESULT: ${{ needs.unit-tests.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          S4_RESULT: ${{ needs.trajectory-local.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != success || "$PYTHON_RESULT" != success || "$DOCKER_RESULT" != success || "$CONSOLE_RESULT" != success || "$S4_RESULT" != success ]]; then
            echo "cloud_state=not_run_upstream_failed" >> "$GITHUB_OUTPUT"
            echo "Main Cloud E2E blocked: all five regular CI jobs must succeed." >&2
            exit 1
          fi
          if [[ "$LANGFUSE_E2E_ENABLED" != true ]]; then
            echo "cloud_state=blocked_disabled" >> "$GITHUB_OUTPUT"
            echo "Main Cloud E2E blocked: LANGFUSE_E2E_ENABLED must equal true." >&2
            exit 1
          fi
          echo "cloud_state=ready" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.cloud_state == 'ready'
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.cloud_state == 'ready'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eval-runner/requirements.txt

      - name: Install async link verification dependencies
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.cloud_state == 'ready'
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/python -m pip install -r services/eval-runner/requirements.txt

      - name: Validate Langfuse Cloud secrets
        id: cloud-secrets
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.cloud_state == 'ready'
        env:
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$LANGFUSE_BASE_URL" ]] || missing+=(LANGFUSE_BASE_URL)
          [[ -n "$LANGFUSE_PUBLIC_KEY" ]] || missing+=(LANGFUSE_PUBLIC_KEY)
          [[ -n "$LANGFUSE_SECRET_KEY" ]] || missing+=(LANGFUSE_SECRET_KEY)
          if (( ${#missing[@]} )); then
            echo "cloud_state=blocked_missing_secrets" >> "$GITHUB_OUTPUT"
            printf 'Missing required test-environment secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          umask 077
          {
            printf 'LANGFUSE_BASE_URL=%s\n' "$LANGFUSE_BASE_URL"
            printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$LANGFUSE_PUBLIC_KEY"
            printf 'LANGFUSE_SECRET_KEY=%s\n' "$LANGFUSE_SECRET_KEY"
            printf 'ARGUS_LANGFUSE_DASHBOARD_URL=%s\n' "$LANGFUSE_BASE_URL"
          } > .env.cloud
          echo "cloud_state=ready" >> "$GITHUB_OUTPUT"

      - name: Run cloud end-to-end tests
        id: cloud-e2e
        if: github.ref == 'refs/heads/main' && steps.cloud-secrets.outputs.cloud_state == 'ready'
        env:
          E2E_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: bash scripts/ci-e2e-cloud.sh

      - name: Remove Cloud credentials file
        if: always()
        run: rm -f .env.cloud

      - name: Record Cloud state
        id: summary
        if: always()
        env:
          GATE_STATE: ${{ steps.gate.outputs.cloud_state }}
          SECRET_STATE: ${{ steps.cloud-secrets.outputs.cloud_state }}
          SECRET_OUTCOME: ${{ steps.cloud-secrets.outcome }}
          E2E_OUTCOME: ${{ steps.cloud-e2e.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GATE_STATE" != ready ]]; then
            state="${GATE_STATE:-not_run_upstream_failed}"
          elif [[ "$SECRET_STATE" != ready ]]; then
            state="${SECRET_STATE:-blocked_missing_secrets}"
          elif [[ "$E2E_OUTCOME" == success ]]; then
            state=passed
          elif [[ "$E2E_OUTCOME" == cancelled || "$SECRET_OUTCOME" == cancelled ]]; then
            state=cancelled
          else
            state=failed
          fi
          printf 'cloud_state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          echo "Cloud state: $state"

      - name: Summarize main Cloud coverage
        if: always()
        env:
          CLOUD_STATE: ${{ steps.summary.outputs.cloud_state }}
          CLOUD_REASON: trusted main Cloud execution result
          POLICY_STATE: main acceptance verifies actual Cloud execution
          RISK_STATE: main push or authorized main dispatch
          CI_CHECKS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.write_cloud_summary

  main-cloud-acceptance:
    name: Main Cloud Acceptance
    needs: [quality, unit-tests, docker-build, console, trajectory-local, cloud-e2e-policy, cloud-e2e-main]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted Cloud evidence parser dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Verify exact main Cloud acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.ci.verify_main_cloud_acceptance

      - name: Upload main Cloud acceptance receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-cloud-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/main-cloud-acceptance/receipt.json
          if-no-files-found: error
          retention-days: 90
