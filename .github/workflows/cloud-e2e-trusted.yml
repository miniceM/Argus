name: Trusted Cloud Candidate

run-name: "Trusted Cloud Candidate PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA recorded by trusted CI
        required: true
        type: string
      expected_base_sha:
        description: Exact 40-character current main/base SHA recorded by trusted CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: argus-trusted-cloud-candidate-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare trusted candidate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested_sha: ${{ steps.prepare.outputs.tested_sha }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted policy parser
        run: python -m pip install PyYAML==6.0.3

      - name: Prepare exact high-risk candidate
        id: prepare
        working-directory: trusted-control
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_ACTOR: ${{ github.actor }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: python -m scripts.ci.cloud_e2e_receipt prepare

      - name: Upload trusted candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted-control/artifacts/candidate/manifest.json
          if-no-files-found: error
          retention-days: 14

  candidate-cloud:
    name: Trusted candidate Cloud E2E
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: langfuse-e2e-candidate
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install candidate test dependencies without Cloud credentials
        working-directory: candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/eval-runner/requirements.txt

      - name: Build candidate images without Cloud credentials
        working-directory: candidate
        env:
          ARGUS_BUILD_ID: ${{ needs.prepare.outputs.tested_sha }}
        run: docker compose --env-file .env.cloud.example -f docker-compose.cloud.yml build

      - name: Revalidate candidate and write test credentials
        working-directory: trusted-control
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: python -m scripts.ci.cloud_e2e_receipt verify

      - name: Run cloud end-to-end tests
        working-directory: candidate
        env:
          ARGUS_CLOUD_BUILD_IMAGES: "false"
          E2E_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.tested_sha }}
        run: bash scripts/ci-e2e-cloud.sh

      - name: Remove Cloud credentials file
        if: always()
        working-directory: candidate
        run: rm -f .env.cloud

      - name: Upload candidate Cloud evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-cloud-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/artifacts/e2e/bootstrap.json
            candidate/artifacts/e2e/v1.json
            candidate/artifacts/e2e/v2.json
            candidate/artifacts/e2e/async-langfuse-link.json
          if-no-files-found: warn
          retention-days: 14

  receipt:
    name: Record trusted Cloud receipt
    needs: [prepare, candidate-cloud]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted policy parser
        run: python -m pip install PyYAML==6.0.3

      - name: Build receipt from Actions API evidence
        if: always()
        working-directory: trusted-control
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.ci.cloud_e2e_receipt record

      - name: Upload trusted candidate receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-cloud-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted-control/artifacts/candidate-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 90

  refresh-policy:
    name: Reconcile Cloud Integration Policy after candidate
    needs: [prepare, receipt]
    # Run after a completed candidate even if receipt failed, so failures get
    # published as failures rather than leaving an obsolete pending status.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately separate from candidate-cloud: never execute PR code or
    # expose Cloud secrets in a job with Actions write permission.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - name: Dispatch trusted current-PR policy reconciliation
        working-directory: trusted-control
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python -m scripts.ci.refresh_cloud_policy
