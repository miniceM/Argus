name: Cloud Integration Policy

run-name: "Cloud Integration Policy (${{ github.event_name }})"

on:
  workflow_run:
    workflows:
      - CI
      - Trusted Cloud Candidate
    types:
      - completed
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number targeting main
        required: true
        type: string
      candidate_run_id:
        description: Optional candidate Run ID to await before publishing current PR status
        required: false
        type: string
      candidate_run_attempt:
        description: Optional exact candidate attempt to await
        required: false
        type: string

permissions: {}

# Serialize every policy refresh. Each evaluator reads live PR/main/run state,
# so an older queued event cannot publish a decision for a stale identity.
concurrency:
  group: argus-cloud-integration-policy
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate current PR policy
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted policy parser
        run: python -m pip install PyYAML==6.0.3

      - name: Wait for the exact dispatched candidate to finish
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != ''
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          POLICY_PR_NUMBER: ${{ inputs.pr_number }}
          POLICY_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          POLICY_CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: python -m scripts.ci.publish_cloud_policy wait-candidate

      - name: Evaluate exact current PR identities
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_PR_NUMBER: ${{ inputs.pr_number }}
          POLICY_DECISIONS_PATH: artifacts/policy/decisions.json
        run: python -m scripts.ci.publish_cloud_policy evaluate

      - name: Upload trusted policy decisions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-integration-policy-decisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/policy/decisions.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish current-head policy status
    needs: evaluate
    if: needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only write scope is commit statuses. Read scopes are limited to the
    # live PR/main identity recheck performed immediately before each write.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-integration-policy-decisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/policy

      - name: Publish only revalidated current-head decisions
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLICY_DECISIONS_PATH: artifacts/policy/decisions.json
        run: python -m scripts.ci.publish_cloud_policy publish

  dispatch:
    name: Automatically start required Cloud candidate
    needs: evaluate
    if: >-
      needs.evaluate.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this trusted-main job may dispatch another workflow. It never checks
    # out PR code and receives no Langfuse secrets.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Automatically dispatch high-risk PR Cloud validation
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.ci.auto_dispatch_cloud_candidate
