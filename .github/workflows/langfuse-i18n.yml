name: Langfuse i18n

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/langfuse/**"
      - ".github/workflows/langfuse-i18n.yml"
  push:
    branches: [main]
    paths:
      - "deploy/langfuse/**"
      - ".github/workflows/langfuse-i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langfuse-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-ui:
    name: Patch, resources and bilingual UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Prepare and apply the locked patch set
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/langfuse"
          ./deploy/langfuse/scripts/prepare-upstream.sh "$source_dir"
          ./deploy/langfuse/scripts/apply-patches.sh "$source_dir"
          echo "LANGFUSE_UPSTREAM_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Install the locked upstream dependencies
        shell: bash
        run: |
          cd "$LANGFUSE_UPSTREAM_DIR"
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
          pnpm install --frozen-lockfile

      - name: Validate ICU, hard-coded copy and TypeScript
        shell: bash
        run: |
          node deploy/langfuse/scripts/check-icu.mjs "$LANGFUSE_UPSTREAM_DIR"
          node deploy/langfuse/scripts/check-hardcoded-ui.mjs \
            "$LANGFUSE_UPSTREAM_DIR" deploy/langfuse/hardcoded-ui-baseline.json
          cd "$LANGFUSE_UPSTREAM_DIR"
          pnpm exec turbo run typecheck --filter=web...
          pnpm --dir web exec eslint \
            src/pages/_app.tsx src/pages/_document.tsx src/features/i18n \
            src/components/nav/AppSidebar/AppSidebar.tsx \
            src/components/nav/nav-main.tsx \
            src/components/layouts/routes.tsx \
            src/components/layouts/page-header.tsx \
            src/components/layouts/breadcrumb.tsx \
            src/components/layouts/page-tabs.tsx \
            src/components/table/data-table.tsx \
            src/components/table/simple-data-table.tsx \
            --max-warnings 0

      - name: Run locale and switcher tests
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXTAUTH_URL: http://localhost:3000
          SALT: argus-i18n-ci
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: clickhouse
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          cd "$LANGFUSE_UPSTREAM_DIR"
          pnpm --dir web exec vitest run --project client \
            src/features/i18n/config.clienttest.ts \
            src/features/i18n/LanguageSwitcher.clienttest.tsx

      - name: Build Storybook and capture bilingual smoke screenshots
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXTAUTH_SECRET: argus-i18n-storybook-secret
          NEXTAUTH_URL: http://localhost:3000
          SALT: argus-i18n-storybook-salt-at-least-32-characters
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: clickhouse
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          cd "$LANGFUSE_UPSTREAM_DIR"
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web build-storybook --output-dir "$RUNNER_TEMP/storybook"
          python3 -m http.server 6006 --directory "$RUNNER_TEMP/storybook" >/tmp/storybook.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6006/index.json >/dev/null && break
            sleep 1
          done
          LANGFUSE_UPSTREAM_DIR="$LANGFUSE_UPSTREAM_DIR" \
          I18N_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/i18n" \
            node "$GITHUB_WORKSPACE/deploy/langfuse/scripts/storybook-smoke.mjs"

      - name: Upload bilingual UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: langfuse-i18n-ui-${{ github.run_id }}
          path: artifacts/i18n/
          if-no-files-found: warn
          retention-days: 14

  main-cloud-release-gate:
    name: Verify Main Cloud Acceptance for Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted Cloud evidence parser dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Wait for and verify exact-SHA Main Cloud Acceptance receipt
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.ci.verify_main_cloud_acceptance --wait-for-current-main --timeout-seconds 3600 --poll-seconds 20

  image:
    name: Build patched Langfuse image
    needs: [patch-and-ui, main-cloud-release-gate]
    if: >-
      always() &&
      needs.patch-and-ui.result == 'success' &&
      (github.event_name == 'pull_request' || needs.main-cloud-release-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
      # 生成 SLSA provenance 与 SBOM 证明
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted Cloud evidence parser dependency
        run: python -m pip install PyYAML==6.0.3

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Add swap for the upstream Next.js production build
        shell: bash
        run: |
          swap_file="/mnt/argus-langfuse-${GITHUB_RUN_ID}.swap"
          sudo fallocate -l 8G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          swapon --show

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/minicem/argus-langfuse-i18n
          flavor: latest=false
          tags: |
            type=raw,value=4.38.0-i18n-${{ github.sha }}
            type=raw,value=4.38.0-i18n,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate current main Cloud receipt immediately before publication
        if: github.event_name != 'pull_request'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.ci.verify_main_cloud_acceptance --wait-for-current-main --timeout-seconds 0 --poll-seconds 1

      - name: Build and publish the release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/langfuse
          file: deploy/langfuse/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=4.38.0-i18n
          build-args: |
            LANGFUSE_REPOSITORY=https://github.com/langfuse/langfuse.git
            LANGFUSE_TAG=v4.38.0
            LANGFUSE_COMMIT=4ecaabed8d9c39d0d3ba483f02ba1cca020388a9
            NEXT_PUBLIC_BUILD_ID=argus-i18n-${{ github.sha }}
          cache-from: type=gha,scope=langfuse-i18n
          cache-to: type=gha,mode=max,scope=langfuse-i18n
          # SLSA provenance 与 SBOM 只在真正发布镜像时生成：PR 走 load:true
          # （docker exporter），而 docker exporter 无法导出 attestation 造成的
          # manifest list，会直接构建失败。发布路径用 OCI exporter 不受此限制。
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

      - name: Record image identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_REF: ghcr.io/minicem/argus-langfuse-i18n
          IMAGE_TAG: ghcr.io/minicem/argus-langfuse-i18n:4.38.0-i18n-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_BUILD_ID: argus-i18n-${{ github.sha }}
        run: |
          mkdir -p artifacts/i18n-image
          cp deploy/langfuse/upstream/manifest.json artifacts/i18n-image/
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            docker image inspect "$IMAGE_TAG" \
              > artifacts/i18n-image/inspect.json
            docker image inspect --format '{{.Id}}' "$IMAGE_TAG" \
              > artifacts/i18n-image/image-id.txt
          else
            {
              printf '%s@%s\n' "$IMAGE_REF" "$IMAGE_DIGEST"
              printf 'buildId=%s\n' "$IMAGE_BUILD_ID"
            } \
              | tee artifacts/i18n-image/release-image.txt
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: langfuse-i18n-image-${{ github.run_id }}
          path: artifacts/i18n-image/
          retention-days: 14

  remote-integration:
    name: Remote self-hosted acceptance
    needs: image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.LANGFUSE_I18N_INTEGRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: langfuse-i18n-integration
    env:
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_ADMIN_EMAIL: ${{ secrets.LANGFUSE_ADMIN_EMAIL }}
      LANGFUSE_ADMIN_PASSWORD: ${{ secrets.LANGFUSE_ADMIN_PASSWORD }}
      LANGFUSE_PROJECT_ID: ${{ vars.LANGFUSE_PROJECT_ID }}
      LANGFUSE_I18N_IMAGE_DIGEST: ${{ vars.LANGFUSE_I18N_IMAGE_DIGEST }}
      LANGFUSE_I18N_BUILD_ID: ${{ vars.LANGFUSE_I18N_BUILD_ID }}
      LANGFUSE_GHCR_USERNAME: ${{ secrets.LANGFUSE_GHCR_USERNAME }}
      LANGFUSE_GHCR_TOKEN: ${{ secrets.LANGFUSE_GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run API, runner and bilingual UI acceptance
        run: make validate-langfuse-integration
      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: langfuse-i18n-integration-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
