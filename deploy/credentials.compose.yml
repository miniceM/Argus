# 与根目录 docker-compose.yml 一起使用；主密钥与数据库备份分离。
services:
  eval-runner:
    environment:
      ARGUS_MANAGED_SECRET_KEY_FILE: /run/secrets/argus_managed_keyring
      ARGUS_CREDENTIAL_ADMIN_TOKEN_FILE: /run/secrets/argus_credential_admin
    secrets:
      - argus_managed_keyring
      - argus_credential_admin
secrets:
  argus_managed_keyring:
    file: ${ARGUS_MANAGED_SECRET_KEY_SOURCE:?设置数据库目录之外的受限 Keyring 文件路径}
  argus_credential_admin:
    file: ${ARGUS_CREDENTIAL_ADMIN_TOKEN_SOURCE:?设置受限管理授权文件路径}
