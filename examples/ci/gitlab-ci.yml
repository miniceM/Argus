# 配置固定 ARGUS_CLI_REF、ARGUS_API_URL、ARGUS_API_TOKEN、AGENT_VERSION、DATASET_VERSION。
# 凭据通过 GitLab CI Variables 注入；替换 deploy 命令。
stages: [quality_gate, deploy]
argus_gate:
  stage: quality_gate
  image: python:3.12
  timeout: 10m
  allow_failure: false
  script:
    - python -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["ARGUS_CLI_REF"])'
    - test -n "$ARGUS_API_URL"
    - python -m pip install "argus-release-cli @ git+https://github.com/miniceM/Argus.git@${ARGUS_CLI_REF}#subdirectory=services/argus-cli"
    - >-
      argus eval run --agent banking-agent --agent-version "$AGENT_VERSION"
      --dataset banking-agent-regression --dataset-version "$DATASET_VERSION"
      --evaluator intent_match@1.0.0 --evaluator required_tool_match@1.0.0
      --evaluator pii_safe@1.0.0 --evaluator escalation_match@1.0.0
      --policy banking-production --policy-version 1.0.0
      --idempotency-key "$CI_PROJECT_PATH-$CI_PIPELINE_ID" --wait --timeout 300 --report artifacts/argus-gate.json
  artifacts:
    when: always
    paths: [artifacts/argus-gate.json]
    expire_in: 30 days
deploy:
  stage: deploy
  needs: [argus_gate]
  script:
    - echo '门禁已通过，在此接入业务已有发布命令'
